<style>
  :root {
    --primary: #6f4e37;
    --primary-dark: #3e2723;
    --primary-light: #8b6f47;
    --success: #27ae60;
    --danger: #e74c3c;
    --warning: #f39c12;
    --info: #3498db;
    --bg: #f5f5f7;
    --card: #ffffff;
    --text: #1d1d1f;
    --text-muted: #86868b;
    --border: #e5e5e7;
    --radius: 14px;
    --nav-height: 64px;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    height: 100%;
    overscroll-behavior: none;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 15px;
    line-height: 1.4;
    -webkit-font-smoothing: antialiased;
  }

  .oculto { display: none !important; }

  /* ═══════════ PANTALLA LOGIN ═══════════ */
  .pantalla-login {
    position: fixed;
    inset: 0;
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 1000;
  }

  .login-card {
    background: white;
    border-radius: 24px;
    padding: 32px 24px;
    width: 100%;
    max-width: 380px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,.3);
    animation: fadeIn .4s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .login-logo {
    font-size: 56px;
    margin-bottom: 8px;
    line-height: 1;
  }

  .login-card h1 {
    font-size: 22px;
    color: var(--primary-dark);
    margin-bottom: 6px;
    font-weight: 700;
  }

  .login-sub {
    font-size: 13px;
    color: var(--text-muted);
    margin-bottom: 24px;
  }

  .pin-display {
    display: flex;
    justify-content: center;
    gap: 14px;
    margin-bottom: 24px;
    min-height: 24px;
  }

  .pin-display span {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--border);
    transition: all .15s;
  }

  .pin-display span.activo {
    background: var(--primary);
    transform: scale(1.2);
  }

  .pin-pad {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-bottom: 20px;
  }

  .pin-btn {
    border: none;
    background: #f5f5f7;
    color: var(--text);
    font-size: 22px;
    font-weight: 600;
    padding: 16px;
    border-radius: 12px;
    cursor: pointer;
    transition: all .1s;
    font-family: inherit;
    user-select: none;
  }

  .pin-btn:active {
    background: var(--primary);
    color: white;
    transform: scale(.95);
  }

  .pin-btn-fn {
    background: #e5e5e7;
    font-size: 18px;
  }

  .login-btn {
    margin-bottom: 12px;
  }

  .login-hint {
    font-size: 11px;
    color: var(--text-muted);
  }

  /* ═══════════ APP ═══════════ */
  .app {
    padding-bottom: calc(var(--nav-height) + 80px);
    min-height: 100vh;
  }

  .app-header {
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    color: white;
    padding: 12px 16px;
    position: sticky;
    top: 0;
    z-index: 50;
    box-shadow: 0 2px 12px rgba(0,0,0,.15);
  }

  .header-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .app-header h1 {
    font-size: 18px;
    font-weight: 600;
  }

  .app-header p {
    font-size: 12px;
    opacity: .85;
    margin-top: 2px;
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .header-actions {
    display: flex;
    gap: 8px;
  }

  .header-btn {
    background: rgba(255,255,255,.15);
    border: none;
    color: white;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .header-btn:active {
    background: rgba(255,255,255,.3);
  }

  .online-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #4ade80;
    display: inline-block;
    box-shadow: 0 0 6px #4ade80;
  }

  .online-dot.off {
    background: #ef4444;
    box-shadow: 0 0 6px #ef4444;
  }

  /* ═══════════ CONTAINER ═══════════ */
  .container {
    padding: 12px;
    max-width: 900px;
    margin: 0 auto;
  }

  /* ═══════════ VISTAS ═══════════ */
  .vista {
    display: none;
    animation: fadeIn .2s;
  }

  .vista.activa {
    display: block;
  }

  /* ═══════════ CARDS ═══════════ */
  .card {
    background: var(--card);
    border-radius: var(--radius);
    padding: 14px;
    margin-bottom: 12px;
    box-shadow: 0 1px 4px rgba(0,0,0,.05);
  }

  .card h2 {
    font-size: 14px;
    margin-bottom: 12px;
    color: var(--primary);
    font-weight: 600;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  /* ═══════════ SEARCH ═══════════ */
  .search-bar {
    position: relative;
    margin-bottom: 12px;
  }

  .search-bar input {
    padding-left: 38px;
    margin: 0;
  }

  .search-bar::before {
    content: '🔍';
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 14px;
    opacity: .5;
    pointer-events: none;
  }

  /* ═══════════ CATEGORÍAS ═══════════ */
  .cats {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 8px;
    margin-bottom: 10px;
    scrollbar-width: none;
  }

  .cats::-webkit-scrollbar {
    display: none;
  }

  .cat {
    flex-shrink: 0;
    padding: 8px 16px;
    border-radius: 20px;
    background: var(--card);
    border: 1px solid var(--border);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    white-space: nowrap;
    transition: all .15s;
    color: var(--text);
  }

  .cat.active {
    background: var(--primary);
    color: white;
    border-color: var(--primary);
  }

  /* ═══════════ GRID PRODUCTOS ═══════════ */
  .grid-productos {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 10px;
  }

  @media (max-width: 380px) {
    .grid-productos {
      grid-template-columns: repeat(2, 1fr);
    }
  }

  .prod {
    background: var(--card);
    border-radius: 12px;
    padding: 12px;
    box-shadow: 0 1px 4px rgba(0,0,0,.06);
    border: 2px solid transparent;
    cursor: pointer;
    transition: all .12s;
    position: relative;
    min-height: 90px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    user-select: none;
  }

  .prod:active {
    transform: scale(.96);
  }

  .prod.agotado {
    opacity: .4;
    pointer-events: none;
  }

  .prod.seleccionado {
    border-color: var(--primary);
    background: #fdf6f0;
  }

  .prod .nombre {
    font-weight: 600;
    font-size: 14px;
    margin-bottom: 4px;
    line-height: 1.2;
  }

  .prod .precio {
    color: var(--primary);
    font-weight: 700;
    font-size: 16px;
  }

  .prod .stock-mini {
    font-size: 10px;
    color: var(--text-muted);
    margin-top: 4px;
  }

  .prod .stock-mini.bajo {
    color: var(--danger);
    font-weight: 600;
  }

  .prod .badge {
    position: absolute;
    top: 8px;
    right: 8px;
    background: var(--danger);
    color: white;
    font-size: 9px;
    padding: 2px 6px;
    border-radius: 6px;
    font-weight: 700;
    letter-spacing: .3px;
  }

  .prod .cantidad-tag {
    position: absolute;
    top: -8px;
    right: -8px;
    background: var(--primary);
    color: white;
    min-width: 28px;
    height: 28px;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 13px;
    box-shadow: 0 2px 8px rgba(0,0,0,.3);
    border: 2px solid white;
    padding: 0 6px;
  }

  /* ═══════════ BOTONES ═══════════ */
  .btn {
    border: none;
    border-radius: 10px;
    padding: 13px 16px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: all .12s;
    width: 100%;
    font-family: inherit;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }

  .btn:active {
    transform: scale(.98);
  }

  .btn-primary {
    background: var(--primary);
    color: white;
  }

  .btn-success {
    background: var(--success);
    color: white;
  }

  .btn-danger {
    background: var(--danger);
    color: white;
  }

  .btn-warning {
    background: var(--warning);
    color: white;
  }

  .btn-secondary {
    background: #eef0f2;
    color: var(--text);
  }

  .btn-sm {
    padding: 8px 12px;
    font-size: 13px;
    width: auto;
  }

  .btn:disabled {
    opacity: .5;
    cursor: not-allowed;
  }

  .tipo-toggle {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 12px;
  }

  .tipo-toggle .btn.activo {
    background: var(--primary);
    color: white;
  }

  .tipo-toggle .btn.activo#btn-tipo-egr {
    background: var(--danger);
  }

  /* ═══════════ INPUTS ═══════════ */
  input, select, textarea {
    width: 100%;
    padding: 12px 14px;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    font-size: 15px;
    font-family: inherit;
    background: var(--card);
    margin-bottom: 10px;
    transition: border-color .15s;
    color: var(--text);
  }

  input:focus, select:focus, textarea:focus {
    outline: none;
    border-color: var(--primary);
  }

  label {
    font-size: 12px;
    color: var(--text-muted);
    font-weight: 600;
    margin-bottom: 4px;
    display: block;
    letter-spacing: .3px;
    text-transform: uppercase;
  }

  .fila-2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }

  /* ═══════════ STATS ═══════════ */
  .stats {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    margin-bottom: 12px;
  }

  .stats.three {
    grid-template-columns: repeat(3, 1fr);
  }

  .stat {
    background: var(--card);
    border-radius: 12px;
    padding: 14px 10px;
    text-align: center;
    box-shadow: 0 1px 4px rgba(0,0,0,.05);
  }

  .stat .valor {
    font-size: 18px;
    font-weight: 700;
    color: var(--primary);
  }

  .stat .label {
    font-size: 10px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: .5px;
    margin-top: 3px;
    font-weight: 600;
  }

  /* ═══════════ CARRITO BAR ═══════════ */
  .carrito-bar {
    position: fixed;
    bottom: calc(var(--nav-height) + 12px);
    left: 12px;
    right: 12px;
    background: var(--primary);
    color: white;
    border-radius: var(--radius);
    padding: 14px 18px;
    display: none;
    justify-content: space-between;
    align-items: center;
    box-shadow: 0 6px 24px rgba(111,78,55,.45);
    z-index: 90;
    cursor: pointer;
    max-width: 900px;
    margin: 0 auto;
    animation: slideUp .25s;
  }

  @keyframes slideUp {
    from { transform: translateY(100%); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }

  .carrito-bar.visible {
    display: flex;
  }

  .carrito-bar .info {
    font-weight: 600;
    font-size: 13px;
    opacity: .9;
  }

  .carrito-bar .total {
    font-size: 20px;
    font-weight: 700;
  }

  /* ═══════════ NAV ═══════════ */
  .app-nav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: var(--card);
    display: flex;
    border-top: 1px solid var(--border);
    box-shadow: 0 -2px 12px rgba(0,0,0,.06);
    z-index: 100;
    padding-bottom: env(safe-area-inset-bottom);
    height: var(--nav-height);
  }

  .app-nav button {
    flex: 1;
    border: none;
    background: transparent;
    font-size: 10px;
    color: var(--text-muted);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    cursor: pointer;
    transition: all .15s;
    font-family: inherit;
    font-weight: 500;
  }

  .app-nav button .ico {
    font-size: 22px;
    line-height: 1;
  }

  .app-nav button.activo {
    color: var(--primary);
    font-weight: 600;
  }

  .app-nav button.activo .ico {
    transform: scale(1.15);
  }

  /* ═══════════ MODAL ═══════════ */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.5);
    display: none;
    align-items: flex-end;
    justify-content: center;
    z-index: 200;
    backdrop-filter: blur(4px);
  }

  .modal-overlay.visible {
    display: flex;
  }

  .modal {
    background: var(--card);
    width: 100%;
    max-width: 500px;
    border-radius: 20px 20px 0 0;
    padding: 20px;
    max-height: 92vh;
    overflow-y: auto;
    animation: slideUpModal .25s ease;
    padding-bottom: calc(20px + env(safe-area-inset-bottom));
  }

  @keyframes slideUpModal {
    from { transform: translateY(100%); }
    to { transform: translateY(0); }
  }

  .modal h3 {
    font-size: 18px;
    margin-bottom: 14px;
    color: var(--primary);
  }

  /* ═══════════ ITEM LISTA ═══════════ */
  .item-lista {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 0;
    border-bottom: 1px solid #f0f0f0;
    font-size: 14px;
  }

  .item-lista:last-child {
    border-bottom: none;
  }

  .item-lista .acciones {
    display: flex;
    gap: 6px;
  }

  .item-lista .acciones button {
    border: none;
    background: #f0f0f0;
    min-width: 34px;
    height: 34px;
    border-radius: 8px;
    font-size: 15px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background .15s;
  }

  .item-lista .acciones button:active {
    background: #ddd;
  }

  /* ═══════════ TOTALES ═══════════ */
  .totales {
    border-top: 2px dashed var(--border);
    padding-top: 12px;
    margin-top: 12px;
  }

  .totales .fila {
    display: flex;
    justify-content: space-between;
    padding: 6px 0;
    font-size: 14px;
  }

  .totales .fila.total {
    font-size: 22px;
    font-weight: 700;
    color: var(--primary);
    border-top: 1px solid var(--border);
    padding-top: 12px;
    margin-top: 8px;
  }

  /* ═══════════ TOAST ═══════════ */
  .toast {
    position: fixed;
    top: 80px;
    left: 50%;
    transform: translateX(-50%) translateY(-20px);
    background: #333;
    color: white;
    padding: 12px 22px;
    border-radius: 24px;
    font-size: 14px;
    z-index: 300;
    opacity: 0;
    transition: all .3s;
    pointer-events: none;
    box-shadow: 0 4px 20px rgba(0,0,0,.3);
    max-width: 90%;
    text-align: center;
  }

  .toast.visible {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  .toast.ok {
    background: var(--success);
  }

  .toast.err {
    background: var(--danger);
  }

  /* ═══════════ LOADER ═══════════ */
  .loader {
    position: fixed;
    inset: 0;
    background: rgba(255,255,255,.85);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 500;
    backdrop-filter: blur(2px);
  }

  .loader.visible {
    display: flex;
  }

  .spinner {
    width: 44px;
    height: 44px;
    border: 4px solid #eee;
    border-top-color: var(--primary);
    border-radius: 50%;
    animation: spin .7s linear infinite;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  /* ═══════════ VACÍO ═══════════ */
  .vacio {
    text-align: center;
    color: var(--text-muted);
    padding: 40px 20px;
    font-size: 14px;
  }

  .vacio .ico {
    font-size: 42px;
    display: block;
    margin-bottom: 10px;
    opacity: .5;
  }

  /* ═══════════ TICKET ═══════════ */
  .ticket {
    background: white;
    padding: 20px;
    font-family: 'Courier New', monospace;
    font-size: 13px;
    max-width: 300px;
    margin: 0 auto;
    border: 1px dashed #999;
    color: #000;
  }

  .ticket .centro {
    text-align: center;
  }

  .ticket .linea {
    border-top: 1px dashed #333;
    margin: 8px 0;
  }

  .ticket .fila {
    display: flex;
    justify-content: space-between;
    margin: 2px 0;
    gap: 10px;
  }

  .ticket .fila span:first-child {
    flex: 1;
  }

  .ticket .fila span:last-child {
    white-space: nowrap;
  }

  .ticket .total-final {
    font-size: 17px;
    font-weight: 700;
    margin-top: 6px;
  }

  /* ═══════════ CANVAS ═══════════ */
  canvas {
    max-width: 100%;
  }

  /* ═══════════ MODO OSCURO ═══════════ */
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1c1e;
      --card: #2c2c2e;
      --text: #f5f5f7;
      --text-muted: #8e8e93;
      --border: #38383a;
    }

    .prod.seleccionado {
      background: #3a2f28;
    }

    .btn-secondary {
      background: #3a3a3c;
      color: var(--text);
    }

    .item-lista .acciones button {
      background: #3a3a3c;
      color: var(--text);
    }

    .pin-btn {
      background: #3a3a3c;
      color: var(--text);
    }

    .pin-btn-fn {
      background: #2c2c2e;
    }

    .login-card {
      background: #2c2c2e;
    }
  }
</style>
