<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Descargar Flowy</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="theme-color" content="#6f4e37">
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:Arial,sans-serif;background:#f5efe9;color:#3b2a1d;text-align:center;padding:24px}
  img.logo{width:96px;height:96px;border-radius:22px;margin-top:16px}
  h1{margin:12px 0 4px}
  p.sub{margin:0 0 24px;color:#6f4e37}
  .grid{display:grid;gap:12px;max-width:420px;margin:0 auto}
  .btn{display:block;padding:16px;border-radius:12px;border:0;background:#6f4e37;color:#fff;font-size:17px;text-decoration:none;cursor:pointer;width:100%}
  .btn.alt{background:#fff;color:#6f4e37;border:2px solid #6f4e37}
  .btn small{display:block;font-size:12px;opacity:.85;margin-top:3px}
  #ios{display:none;background:#fff;border-radius:12px;padding:14px;text-align:left;font-size:14px}
  h3{margin:28px 0 8px}
</style>
</head>
<body>
<img class="logo" src="icons/icon-192.png" alt="Flowy">
<h1>Flowy</h1>
<p class="sub">Instala el sistema de pedidos en tu dispositivo</p>

<div class="grid">
  <button class="btn" id="install">📲 Instalar en este dispositivo<small>Celular, tablet o PC (Chrome / Edge)</small></button>
  <div id="ios"><b>iPhone / iPad:</b> toca <b>Compartir</b> y luego <b>"Agregar a pantalla de inicio"</b>.</div>
  <a class="btn alt" href="app.html">🌐 Abrir sin instalar</a>
</div>

<h3>Programa de escritorio</h3>
<div class="grid">
  <a class="btn" data-f="Flowy-Setup.exe">🪟 Windows (.exe)</a>
  <a class="btn" data-f="Flowy.dmg">🍎 macOS (.dmg)</a>
  <a class="btn" data-f="Flowy.AppImage">🐧 Linux (AppImage)</a>
  <a class="btn" data-f="Flowy.deb">🐧 Linux (.deb)</a>
</div>

<script>
  const REPO_URL = 'https://github.com/rodrigoquisbert543-alt/Flowy';
  document.querySelectorAll('a[data-f]').forEach(a => a.href = REPO_URL + '/releases/latest/download/' + a.dataset.f);

  let deferred;
  const btn = document.getElementById('install');
  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
  if (matchMedia('(display-mode: standalone)').matches || navigator.standalone) location.replace('app.html');

  addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferred = e; });
  addEventListener('appinstalled', () => { btn.textContent = '✅ Instalada'; });
  btn.onclick = async () => {
    if (deferred) { deferred.prompt(); await deferred.userChoice; deferred = null; }
    else if (isIOS) document.getElementById('ios').style.display = 'block';
    else alert('Usa el menú del navegador > "Instalar aplicación" (o "Agregar a pantalla de inicio").');
  };
  if (isIOS) document.getElementById('ios').style.display = 'block';
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
